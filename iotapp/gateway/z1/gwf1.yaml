---
apiVersion: v1
kind: Service
metadata:
  name: iotapp-gwf1
spec:
  selector:
    app: iotapp-gwf1
  ports:
    - name: gwf1-port
      port: 8281
      targetPort: 8281
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iotapp-gwf1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iotapp-gwf1
  template:
    metadata:
      labels:
        app: iotapp-gwf1
    spec:
      containers:
      - name: iotapp-gwf1-container
        image: iotapp-node-image:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE
          value: "gateway/gateway.js"
        - name: ARGS
          value: "--local_ip 0.0.0.0 --local_port 8281 --local_name gwf1 --remote_ip iotapp-gwi-z1 --remote_port 8182 --remote_name gwi"
        ports:
        - containerPort: 8281
