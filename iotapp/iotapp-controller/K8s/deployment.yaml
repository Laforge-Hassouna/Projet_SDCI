apiVersion: apps/v1
kind: Deployment
metadata:
  name: iotapp-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iotapp-controller
  template:
    metadata:
      labels:
        app: iotapp-controller
    spec:
      serviceAccountName: iotapp-controller-sa 
      containers:
      - name: controller
        image: iotapp-controller:latest
        imagePullPolicy: IfNotPresent
